plugins {
    id "com.android.application"
}

android {
    namespace "it.marukoshi.yuvomiwrapper"
    compileSdk 35

    defaultConfig {
        applicationId "it.marukoshi.yuvomiwrapper.generic"
        minSdk 23
        targetSdk 34
        versionCode 3
        versionName "0.2.1"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
