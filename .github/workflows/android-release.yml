name: Android release

on:
  push:
    tags:
      - 'v0.2.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [personal, generic]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build release APK
        run: gradle -p "source/${{ matrix.variant }}" :app:assembleRelease --no-daemon

      - name: Rename APK
        run: |
          apk_path="$(find "source/${{ matrix.variant }}/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          cp "$apk_path" "yuvomi-${{ matrix.variant }}-${GITHUB_REF_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuvomi-${{ matrix.variant }}-${{ github.ref_name }}
          path: yuvomi-${{ matrix.variant }}-${{ github.ref_name }}.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: yuvomi-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta') }}
